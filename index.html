                    '/service-areas/el-mirage-az': 'Plumbing & Leak Detection in El Mirage, AZ | leakdetectioninelmirage'
                };
                document.title = titles[currentRoute] || 'leakdetectioninelmirage';
                window.scrollTo(0, 0);
            }, [currentRoute]);

            const renderRoute = () => {
                switch(currentRoute) {
                    case '/': return <Home navigate={setCurrentRoute} />;
                    case '/leak-detection': return <LeakDetection navigate={setCurrentRoute} />;
                    case '/slab-leak-detection': return <SlabLeak navigate={setCurrentRoute} />;
                    case '/service-areas/el-mirage-az': return <ElMirageLocation navigate={setCurrentRoute} />;
                    default: return <Home navigate={setCurrentRoute} />;
                }
            };

            return (
                <div class="min-h-screen flex flex-col font-sans text-gray-900 bg-gray-50">
                    <Header currentRoute={currentRoute} navigate={setCurrentRoute} />
                    <div class="flex-grow">
                        {renderRoute()}
                    </div>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
